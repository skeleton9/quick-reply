<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Reply 设置</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 24px;
      color: #0f1419;
      line-height: 1.5;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.desc { color: #536471; margin-top: 0; }
    label {
      display: block;
      font-weight: 600;
      margin: 20px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd9de;
      border-radius: 8px;
      font: inherit;
    }
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cfd9de;
      border-radius: 8px;
      font: inherit;
      resize: vertical;
      min-height: 72px;
      line-height: 1.5;
    }
    input:focus {
      outline: 2px solid #1d9bf0;
      border-color: #1d9bf0;
    }
    textarea:focus {
      outline: 2px solid #1d9bf0;
      border-color: #1d9bf0;
    }
    .actions { margin-top: 24px; display: flex; gap: 12px; align-items: center; }
    button {
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 10px 20px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1a8cd8; }
    #status { color: #00ba7c; font-size: 14px; }
    .hint { font-size: 13px; color: #536471; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Quick Reply for X</h1>
  <p class="desc">配置火山方舟 API，用于生成 X 帖子的建议回复。</p>

  <label for="apiKey">API Key</label>
  <input id="apiKey" type="password" placeholder="Bearer token" autocomplete="off" />
  <p class="hint">在火山方舟控制台获取，格式参考 docs/API_REF.md</p>

  <label for="apiUrl">API URL</label>
  <input id="apiUrl" type="url" />

  <label for="model">Model</label>
  <input id="model" type="text" />

  <label for="toneGuidance">语气风格</label>
  <textarea id="toneGuidance" rows="3"></textarea>
  <p class="hint">写入 prompt 的 “Vary tone:” 说明，例如 thoughtful, witty, supportive, question-based</p>

  <div class="actions">
    <button id="save">保存</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
